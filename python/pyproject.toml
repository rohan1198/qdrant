[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "horobase"
version = "0.1.0"
description = "Hyperbolic hierarchical vector search on top of Qdrant"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "qdrant-client>=1.14",
    "numpy>=1.24",
    "torch>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
encoder = [
    "sentence-transformers>=2.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["horobase*"]
